<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>景點介紹 | 澎湖旅遊指南</title>
  <meta name="description" content="澎湖景點介紹。資料與照片來源：交通部觀光署澎湖國家風景區管理處。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="page-place">
  <header class="topbar">
    <nav class="topbar-inner" aria-label="主要導覽">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>澎湖旅遊指南</a>
      <div class="topbar-links">
        <a class="topbar-link" href="index.html#areas">地區</a>
        <a class="topbar-link" href="index.html#places">所有景點</a>
      </div>
    </nav>
  </header>

  <main id="place-root" aria-live="polite">
    <!-- 景點詳情由 assets/js/place.js 依 ?slug= 動態渲染（AGENTS.md §5 詳情頁結構） -->
    <noscript><div class="empty-state"><p class="empty-state-title">本站需要啟用 JavaScript 才能瀏覽景點介紹。</p></div></noscript>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-brand">澎湖旅遊指南</p>
      <p class="footer-text">景點資料與照片來源：<a href="https://www.penghu-nsa.gov.tw/" target="_blank" rel="noopener">交通部觀光署澎湖國家風景區管理處</a>。開放時間、票價、船班等資訊常有變動，出發前請至官網確認。</p>
    </div>
  </footer>

  <!-- 相簿燈箱(T13):點相簿縮圖開啟;由 assets/js/place.js 控制(AGENTS.md §5) -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="照片檢視" hidden>
    <div class="lightbox-stage" id="lightbox-stage">
      <img class="lightbox-img" id="lightbox-img" alt="" draggable="false">
    </div>
    <button type="button" class="lightbox-btn lightbox-close" id="lightbox-close" aria-label="關閉(Esc)">✕</button>
    <button type="button" class="lightbox-btn lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="上一張(←)">‹</button>
    <button type="button" class="lightbox-btn lightbox-nav lightbox-next" id="lightbox-next" aria-label="下一張(→)">›</button>
    <div class="lightbox-bar">
      <p class="lightbox-count" id="lightbox-count" aria-live="polite"></p>
      <div class="lightbox-tools" role="group" aria-label="縮放">
        <button type="button" class="lightbox-btn lightbox-zoom-out" id="lightbox-zoom-out" aria-label="縮小(-)">−</button>
        <button type="button" class="lightbox-zoom-level" id="lightbox-zoom-level" aria-label="重設為原始大小(0)">100%</button>
        <button type="button" class="lightbox-btn lightbox-zoom-in" id="lightbox-zoom-in" aria-label="放大(+)">+</button>
      </div>
      <p class="lightbox-credit" id="lightbox-credit"></p>
    </div>
  </div>

  <script src="assets/js/place.js"></script>
</body>
</html>
